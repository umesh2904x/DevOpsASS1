name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  checks: read
  actions: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ---------- gate: only deploy what CI already validated ----------
  verify:
    name: Verify CI status
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Confirm the CI run for this commit succeeded
        id: gate
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const sha = context.sha;
            const { data } = await github.rest.checks.listForRef({ ref: sha });
            const ci = data.check_runs.filter((c) => c.name === 'CI');
            if (ci.length === 0) {
              core.setFailed('No CI check run found for this commit - refusing to deploy');
              return;
            }
            const pending = ci.filter((c) => c.status !== 'completed');
            if (pending.length) {
              core.setFailed(`CI still running: ${pending.map((c) => c.name).join(', ')}`);
              return;
            }
            const failed = ci.filter((c) => c.conclusion !== 'success');
            if (failed.length) {
              core.setFailed(`CI checks not green: ${failed.map((c) => c.name).join(', ')}`);
              return;
            }
            core.setOutput('ready', 'true');
            core.info(`All ${ci.length} CI checks are green for ${sha}`);

  # ---------- build image and verify it runs ----------
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "## Container image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- deploy the image to a staging environment ----------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: image
    environment:
      name: staging
      url: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Pull the released image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Run the container on the staging host
        run: |
          docker rm -f shopverse-staging 2>/dev/null || true
          docker run -d --name shopverse-staging -p 3000:3000 \
            ghcr.io/${{ github.repository }}:latest

      - name: Post-deploy health probe
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then
              echo ""
              echo "deployment healthy"
              docker rm -f shopverse-staging
              exit 0
            fi
            sleep 2
          done
          echo "deployment failed health probe"
          docker logs shopverse-staging
          exit 1

      - name: Smoke test the deployed endpoints
        run: |
          curl -fsS "http://localhost:3000/api/products" | head -c 200
          echo ""
          curl -fsS -X POST http://localhost:3000/api/cart/items \
            -H 'content-type: application/json' \
            -H 'x-session-id: cd-smoke' \
            -d '{"productId":"P-1001","qty":1}' | head -c 200
          echo ""

      - name: Cleanup
        if: always()
        run: docker rm -f shopverse-staging 2>/dev/null || true

  # ---------- release artefacts ----------
  release:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [image, deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/
          retention-days: 30

      - name: Attach artefacts to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ShopVerse 1.0.0
          body: |
            Automated release produced by `cd.yml` on every merge to `main`.
          files: dist/*
          draft: false

  # ---------- optional: real host (Render / Railway / VPS) ----------
  deploy-production:
    name: Deploy to Production Host
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ secrets.DEPLOY_HOOK_URL != '' }}
    environment: production
    steps:
      - name: Trigger the hosting provider's deploy hook
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- static analysis ----------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ---------- test suite ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------- build, package, smoke test ----------
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Show build manifest
        run: cat dist/build-manifest.json

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: shopverse-build
          path: |
            dist/
            package-lock.json
          retention-days: 14

      - name: Smoke test the built application
        run: |
          npm start &
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/api/health; then
              echo ""
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "application did not become healthy" && exit 1

  # ---------- container image (built on PRs so the team can review it) ----------
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shopverse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    if: always()
    steps:
      - name: Write job status to the run summary
        run: |
          {
            echo "## CI result for ${{ github.event.head_commit.message || github.ref_name }}"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Build & Package | ${{ needs.build.result }} |"
            echo "| Docker Image | ${{ needs.docker.result }} |"
            echo ""
            echo "Commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\` by ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
